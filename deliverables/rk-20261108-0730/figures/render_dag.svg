<text x="30" y="42" font-size="22" font-weight="bold" fill="#1d1d1b" text-anchor="start">Manifest → video: each artifact depends only on the layers it shows</text>
<text x="30" y="66" font-size="13.5" font-weight="normal" fill="#52514e" text-anchor="start">Content-hash cache keys mean a one-layer edit regenerates only what that layer touches. A hook/CTA/audio edit reuses both keyframes (~6 s local re-render).</text>
<rect x="30" y="96" width="330" height="560" rx="12" fill="#1f1f1d"/>
