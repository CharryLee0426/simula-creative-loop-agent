<text x="716" y="140.0" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">key = hash(model, quality, prompt(bg, char))</text>
<text x="716" y="157.5" font-size="12.5" font-weight="normal" fill="#52514e" text-anchor="start">cache/keyframes/&lt;hash&gt;.png (all runs)</text>
